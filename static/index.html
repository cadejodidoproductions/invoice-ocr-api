<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice OCR - Upload & Extract</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 10px; font-size: 2.5em; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }

        .upload-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            border: 2px dashed #444;
            transition: all 0.3s;
        }
        .upload-section.dragover {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
        }

        .drop-zone {
            text-align: center;
            padding: 40px;
            cursor: pointer;
        }
        .drop-zone svg { width: 64px; height: 64px; fill: #666; margin-bottom: 15px; }
        .drop-zone p { color: #888; margin-bottom: 15px; }

        .file-input { display: none; }

        .btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(76,175,80,0.4); }
        .btn:disabled { background: #555; cursor: not-allowed; transform: none; box-shadow: none; }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }
        .option-group { display: flex; flex-direction: column; gap: 5px; }
        .option-group label { color: #888; font-size: 14px; }
        .option-group select, .option-group input {
            background: #1a1a2e;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; }

        .file-list {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .file-item {
            background: rgba(76,175,80,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .file-item .remove { cursor: pointer; color: #f44336; font-weight: bold; }

        .results-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 30px;
            display: none;
        }
        .results-section.visible { display: block; }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .result-header h2 { font-size: 1.5em; }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .result-card {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
        }
        .result-card .label { color: #888; font-size: 12px; text-transform: uppercase; }
        .result-card .value { font-size: 1.3em; margin-top: 5px; word-break: break-word; }
        .result-card .value.money { color: #4CAF50; font-weight: bold; }

        .json-output {
            background: #0d1117;
            border-radius: 10px;
            padding: 20px;
            overflow-x: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.5;
            max-height: 400px;
            overflow-y: auto;
        }
        .json-output pre { margin: 0; white-space: pre-wrap; }

        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error { background: rgba(244,67,54,0.2); border: 1px solid #f44336; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .success-badge { background: #4CAF50; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .ml-badge { background: #2196F3; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-left: 10px; }

        .entities-section { margin-top: 20px; }
        .entity-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .entity-tag {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
        }
        .entity-tag.org { background: rgba(156,39,176,0.3); border: 1px solid #9c27b0; }
        .entity-tag.date { background: rgba(33,150,243,0.3); border: 1px solid #2196f3; }
        .entity-tag.money { background: rgba(76,175,80,0.3); border: 1px solid #4CAF50; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Invoice OCR</h1>
        <p class="subtitle">Upload invoices and extract data instantly</p>

        <div class="upload-section" id="uploadSection">
            <div class="drop-zone" id="dropZone">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <p>Drag & drop your invoice here, or click to browse</p>
                <button class="btn" onclick="document.getElementById('fileInput').click()">Select File</button>
                <input type="file" id="fileInput" class="file-input" accept=".pdf,.png,.jpg,.jpeg,.tiff" multiple>
            </div>

            <div class="file-list" id="fileList"></div>

            <div class="options">
                <div class="option-group">
                    <label>API Key</label>
                    <input type="text" id="apiKey" value="test-api-key-12345" placeholder="Enter API key">
                </div>
                <div class="option-group">
                    <label>OCR Language</label>
                    <select id="ocrLang">
                        <option value="">Auto (English)</option>
                        <option value="eng">English</option>
                        <option value="spa">Spanish</option>
                        <option value="fra">French</option>
                        <option value="deu">German</option>
                        <option value="ita">Italian</option>
                        <option value="por">Portuguese</option>
                        <option value="jpn">Japanese</option>
                        <option value="zho">Chinese (Simplified)</option>
                        <option value="kor">Korean</option>
                        <option value="ara">Arabic</option>
                        <option value="rus">Russian</option>
                    </select>
                </div>
                <div class="option-group">
                    <label>Export Format</label>
                    <select id="exportFormat">
                        <option value="json">JSON</option>
                        <option value="csv">CSV</option>
                        <option value="xml">XML</option>
                    </select>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="useOcr" checked>
                <label for="useOcr">Enable OCR for scanned documents</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="useMl">
                <label for="useMl">Enable ML extraction (improved accuracy)</label>
            </div>

            <div style="text-align: center; margin-top: 25px;">
                <button class="btn" id="processBtn" onclick="processFiles()" disabled>Process Invoice</button>
            </div>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="result-header">
                <h2>Extraction Results</h2>
                <div>
                    <span class="success-badge" id="statusBadge">Success</span>
                    <span class="ml-badge" id="mlBadge" style="display:none">ML Enhanced</span>
                </div>
            </div>

            <div class="result-grid" id="resultGrid"></div>

            <div class="entities-section" id="entitiesSection" style="display:none">
                <h3>Detected Entities (ML)</h3>
                <div class="entity-tags" id="entityTags"></div>
            </div>

            <details style="margin-top: 20px;">
                <summary style="cursor: pointer; color: #888;">View Raw JSON</summary>
                <div class="json-output" style="margin-top: 10px;">
                    <pre id="jsonOutput"></pre>
                </div>
            </details>
        </div>

        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Processing your invoice...</p>
        </div>

        <div class="error" id="errorBox" style="display: none;"></div>
    </div>

    <script>
        let selectedFiles = [];

        // Drag and drop
        const dropZone = document.getElementById('dropZone');
        const uploadSection = document.getElementById('uploadSection');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
        });

        ['dragenter', 'dragover'].forEach(evt => {
            dropZone.addEventListener(evt, () => uploadSection.classList.add('dragover'));
        });

        ['dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, () => uploadSection.classList.remove('dragover'));
        });

        dropZone.addEventListener('drop', e => {
            const files = Array.from(e.dataTransfer.files);
            addFiles(files);
        });

        document.getElementById('fileInput').addEventListener('change', e => {
            addFiles(Array.from(e.target.files));
        });

        function addFiles(files) {
            files.forEach(file => {
                if (!selectedFiles.find(f => f.name === file.name)) {
                    selectedFiles.push(file);
                }
            });
            updateFileList();
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        function updateFileList() {
            const list = document.getElementById('fileList');
            list.innerHTML = selectedFiles.map((f, i) => `
                <div class="file-item">
                    <span>${f.name}</span>
                    <span class="remove" onclick="removeFile(${i})">×</span>
                </div>
            `).join('');
            document.getElementById('processBtn').disabled = selectedFiles.length === 0;
        }

        async function processFiles() {
            const apiKey = document.getElementById('apiKey').value;
            const ocrLang = document.getElementById('ocrLang').value;
            const useOcr = document.getElementById('useOcr').checked;
            const useMl = document.getElementById('useMl').checked;
            const exportFormat = document.getElementById('exportFormat').value;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultsSection').classList.remove('visible');
            document.getElementById('errorBox').style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('file', selectedFiles[0]);
                if (ocrLang) formData.append('ocr_lang', ocrLang);
                formData.append('use_ocr', useOcr);
                formData.append('use_ml', useMl);

                const response = await fetch(`/invoice-to-json?export=${exportFormat}`, {
                    method: 'POST',
                    headers: { 'X-API-Key': apiKey },
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Processing failed');
                }

                const data = await response.json();
                displayResults(data);

            } catch (err) {
                document.getElementById('errorBox').textContent = err.message;
                document.getElementById('errorBox').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayResults(data) {
            document.getElementById('resultsSection').classList.add('visible');

            // ML badge
            const mlBadge = document.getElementById('mlBadge');
            mlBadge.style.display = data.ml_enhanced ? 'inline' : 'none';

            // Main fields
            const fields = [
                { key: 'vendor', label: 'Vendor' },
                { key: 'invoice_no', label: 'Invoice #' },
                { key: 'date', label: 'Date' },
                { key: 'due_date', label: 'Due Date' },
                { key: 'total', label: 'Total', money: true },
                { key: 'currency', label: 'Currency' },
                { key: 'subtotal', label: 'Subtotal', money: true },
                { key: 'tax', label: 'Tax', money: true },
            ];

            const grid = document.getElementById('resultGrid');
            grid.innerHTML = fields.map(f => `
                <div class="result-card">
                    <div class="label">${f.label}</div>
                    <div class="value ${f.money ? 'money' : ''}">${data[f.key] || 'N/A'}</div>
                </div>
            `).join('');

            // Entities
            const entitiesSection = document.getElementById('entitiesSection');
            const entityTags = document.getElementById('entityTags');

            if (data.ml_entities) {
                entitiesSection.style.display = 'block';
                let tags = '';
                (data.ml_entities.organizations || []).forEach(e => {
                    tags += `<span class="entity-tag org">${e}</span>`;
                });
                (data.ml_entities.dates || []).forEach(e => {
                    tags += `<span class="entity-tag date">${e}</span>`;
                });
                (data.ml_entities.money || []).forEach(e => {
                    tags += `<span class="entity-tag money">${e}</span>`;
                });
                entityTags.innerHTML = tags || '<span style="color:#888">No entities detected</span>';
            } else {
                entitiesSection.style.display = 'none';
            }

            // JSON output
            document.getElementById('jsonOutput').textContent = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
